# Render Blueprint (FREE tier demo): New > Blueprint > pick this repo.
# Free tier limits: the service sleeps after ~15 min idle (the failsafe loop pauses)
# and there is no persistent disk, so SQLite state resets on every deploy/restart.
# For real use switch to plan: starter and add a disk (see README).
services:
  - type: web
    name: vigil
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker only: the failsafe loop and seeding run once per worker process.
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: APP_ENV
        value: production
      - key: DB_PATH
        value: /tmp/app_state.sqlite3
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false          # you enter it in the Render dashboard; never commit it
