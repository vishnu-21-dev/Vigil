<script>
const scriptBase = window.location.pathname.startsWith('/app') ? '/frontend' : '.';
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.body.appendChild(s);
  });
}
loadScript(scriptBase + '/js/api.js')
  .then(() => loadScript(scriptBase + '/js/devices.js'))
  .catch(err => console.error('Script load failed:', err));
</script>
